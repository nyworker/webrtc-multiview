<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Multiview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    width: 100vw;
    height: 100vh;
  }
  .tile { position: relative; background: #111; overflow: hidden; }
  .tile video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .status {
    position: absolute; left: 10px; top: 10px; padding: 2px 8px; border-radius: 4px;
    background: rgba(0,0,0,.6); color: #ccc; font-size: 13px;
  }
  .status:empty { display: none; }
  .title {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    max-width: calc(100% - 200px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 4px 12px; border-radius: 4px; background: rgba(0,0,0,.6);
    color: #fff; font-size: 16px; font-weight: 600; pointer-events: none;
  }
  .title:empty { display: none; }
  .controls {
    position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px;
    opacity: 0; transition: opacity .2s;
  }
  .tile:hover .controls, .tile:fullscreen .controls { opacity: 1; }
  .controls button {
    width: 40px; height: 40px; border: 0; border-radius: 6px; cursor: pointer;
    background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; padding: 0;
  }
  .controls button:hover { background: rgba(0,0,0,.85); }
  .vu {
    position: absolute; left: 10px; top: 44px; bottom: 10px; width: 8px;
    display: flex; gap: 2px; padding: 2px; border-radius: 3px; background: rgba(0,0,0,.6);
    pointer-events: none;
  }
  .vu .ch { position: relative; flex: 1; background: rgba(255,255,255,.08); }
  .vu .fill {
    position: absolute; inset: 0;
    /* -60..0 dBFS: green to -18, yellow to -6, red above */
    background: linear-gradient(to top, #2ecc40 0%, #2ecc40 70%, #ffdc00 70%, #ffdc00 90%, #ff4136 90%);
    clip-path: inset(100% 0 0 0);
  }
  .vu .peak { position: absolute; left: 0; right: 0; height: 2px; background: #fff; bottom: 0; opacity: 0; }
  .controls svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
// One entry per tile: a URL, or { url, title }. MediaMTX WebRTC URLs play over WHEP;
// URLs ending in .m3u8 play as HLS. Set window.STREAMS in config.js
// (see config.example.js); otherwise assume MediaMTX runs on the host serving this page.
const STREAMS = window.STREAMS
  || Array(4).fill(`${location.protocol}//${location.hostname}:8889/mystream/`);

const ICON_MUTED = '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>';
const ICON_SOUND = '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_FULL  = '<svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>';

function makeTile(entry) {
  const url = typeof entry === 'string' ? entry : entry.url;
  const isHls = /\.m3u8$/i.test(new URL(url).pathname);
  // Default title is the stream path, e.g. "mystream".
  const title = entry.title ?? new URL(url).pathname.replace(/^\/|\/$|\.m3u8$/gi, '');
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.innerHTML = `
    <video autoplay playsinline muted disablepictureinpicture></video>
    <div class="status">Connecting…</div>
    <div class="title"></div>
    <div class="vu"><div class="ch"><div class="fill"></div><div class="peak"></div></div><div class="ch"><div class="fill"></div><div class="peak"></div></div></div>
    <div class="controls">
      <button class="mute" title="Unmute">${ICON_MUTED}</button>
      <button class="full" title="Fullscreen">${ICON_FULL}</button>
    </div>`;
  tile.querySelector('.title').textContent = title;
  const video = tile.querySelector('video');
  const status = tile.querySelector('.status');
  const muteBtn = tile.querySelector('.mute');

  // No pausing: block the context menu (which has Play/Pause) and resume if anything pauses it.
  video.addEventListener('contextmenu', e => e.preventDefault());
  video.addEventListener('pause', () => video.ended || video.play().catch(() => {}));

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.innerHTML = video.muted ? ICON_MUTED : ICON_SOUND;
    muteBtn.title = video.muted ? 'Unmute' : 'Mute';
  };
  const toggleFull = () => document.fullscreenElement
    ? document.exitFullscreen()
    : tile.requestFullscreen();
  tile.querySelector('.full').onclick = toggleFull;
  video.ondblclick = toggleFull;

  document.getElementById('grid').appendChild(tile);
  const meter = makeMeter(tile.querySelector('.vu'));
  (isHls ? playHls : play)(url, video, status, meter);
}

// Shared audio context for stereo VU metering. Browsers keep it suspended until
// the user interacts with the page (unless the site is allowed to play sound), so
// the meters stay flat until then. WebRTC stats can't stand in: Chrome reports
// audioLevel 0 for audio that isn't played out, and the tiles start muted.
const audioCtx = new AudioContext();
const meters = [];
audioCtx.resume();
['pointerdown', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => audioCtx.resume(), { capture: true }));

function makeMeter(el) {
  const chans = [...el.querySelectorAll('.ch')].map(ch => ({
    fill: ch.querySelector('.fill'),
    peakEl: ch.querySelector('.peak'),
    analyser: null, level: 0, peak: 0, peakAt: 0,
  }));
  let source = null;
  const meter = {
    chans,
    attach(track) {
      if (source) source.disconnect();
      source = audioCtx.createMediaStreamSource(new MediaStream([track]));
      const splitter = audioCtx.createChannelSplitter(2);
      source.connect(splitter);
      chans.forEach((c, i) => {
        c.analyser = audioCtx.createAnalyser();
        c.analyser.fftSize = 1024;
        c.buf = new Float32Array(c.analyser.fftSize);
        splitter.connect(c.analyser, i);
      });
    },
  };
  meters.push(meter);
  return meter;
}

// Peak level per channel, -60..0 dBFS, with falloff and a 1.5s peak-hold marker.
let lastFrame = performance.now();
function drawMeters(now) {
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;
  for (const m of meters) for (const c of m.chans) {
    let max = 0;
    if (c.analyser && audioCtx.state === 'running') {
      c.analyser.getFloatTimeDomainData(c.buf);
      for (const v of c.buf) max = Math.max(max, Math.abs(v));
    }
    const db = max > 0 ? 20 * Math.log10(max) : -Infinity;
    const pct = Math.min(1, Math.max(0, (db + 60) / 60));
    c.level = Math.max(pct, c.level - dt * 1.5);
    if (pct >= c.peak) { c.peak = pct; c.peakAt = now; }
    else if (now - c.peakAt > 1500) c.peak = Math.max(c.level, c.peak - dt * 0.5);
    c.fill.style.clipPath = `inset(${(1 - c.level) * 100}% 0 0 0)`;
    c.peakEl.style.bottom = `calc(${c.peak * 100}% - 2px)`;
    c.peakEl.style.opacity = c.peak > 0.01 ? 1 : 0;
  }
  requestAnimationFrame(drawMeters);
}
requestAnimationFrame(drawMeters);

// Minimal WHEP client; reconnects whenever the connection drops.
async function play(url, video, status, meter) {
  const pc = new RTCPeerConnection();
  let retried = false;
  const retry = () => {
    if (retried) return;
    retried = true;
    pc.close();
    status.textContent = 'Reconnecting…';
    setTimeout(() => play(url, video, status, meter), 2000);
  };

  const stream = new MediaStream();
  video.srcObject = stream;
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = e => {
    stream.addTrack(e.track);
    if (e.track.kind === 'audio') meter.attach(e.track);
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') status.textContent = '';
    if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) retry();
  };

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') return resolve();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && resolve();
      setTimeout(resolve, 2000);
    });
    const res = await fetch(new URL('whep', url), {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
  } catch (err) {
    console.warn(url, err);
    retry();
  }
}

// HLS via hls.js (native playback where hls.js isn't supported, e.g. iOS Safari);
// restarts after fatal errors, if playback stalls for 30s, or when the stream ends.
// A playlist marked #EXT-X-ENDLIST means the source stopped, so wait for it to go
// live again rather than replaying the leftover segments. No WebRTC stats here,
// so the meter needs Web Audio and stays flat until the first click/key.
function playHls(url, video, status, meter) {
  let hls = null;
  let lastProgress = performance.now();
  video.addEventListener('timeupdate', () => { lastProgress = performance.now(); });
  video.addEventListener('ended', () => hls && restart());
  video.addEventListener('playing', () => { status.textContent = ''; });
  video.addEventListener('playing', () => {
    const s = video.captureStream?.();
    if (!s) return;
    s.getAudioTracks().slice(0, 1).forEach(t => meter.attach(t));
    s.addEventListener('addtrack', e => e.track.kind === 'audio' && meter.attach(e.track));
  }, { once: true });

  if (!window.Hls?.isSupported()) {
    video.src = url;
    return;
  }
  const restart = () => {
    hls.destroy();
    hls = null;
    status.textContent = 'Reconnecting…';
    setTimeout(start, 2000);
  };
  const start = async () => {
    try {
      const playlist = await (await fetch(url, { cache: 'no-store' })).text();
      if (playlist.includes('#EXT-X-ENDLIST')) {
        status.textContent = 'Stream offline';
        setTimeout(start, 5000);
        return;
      }
    } catch {
      status.textContent = 'Reconnecting…';
      setTimeout(start, 5000);
      return;
    }
    lastProgress = performance.now();
    hls = new Hls({ liveDurationInfinity: true });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      console.warn(url, data);
      restart();
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  };
  setInterval(() => {
    if (hls && performance.now() - lastProgress > 30000) restart();
  }, 5000);
  start();
}

STREAMS.forEach(makeTile);
</script>
</body>
</html>
